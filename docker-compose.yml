services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banking}
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://banking:banking@postgres:5432/banking}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      AUTH_MODE: ${AUTH_MODE}
      DEMO_REFERENCE_TIME: ${DEMO_REFERENCE_TIME:-}
      DEVELOPMENT_USER_ID: ${DEVELOPMENT_USER_ID:-dev-user-001}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-["RS256"]}
      OIDC_JWKS_CACHE_SECONDS: ${OIDC_JWKS_CACHE_SECONDS:-300}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-langgraph}
      LANGGRAPH_CHECKPOINT_DATABASE_URL: ${LANGGRAPH_CHECKPOINT_DATABASE_URL:-postgresql://banking:banking@postgres:5432/banking}
      LANGGRAPH_STRICT_MSGPACK: ${LANGGRAPH_STRICT_MSGPACK:-true}
      RECURRING_TRANSFER_MAX_OCCURRENCES: ${RECURRING_TRANSFER_MAX_OCCURRENCES:-12}
      RECURRING_TRANSFER_MAX_DAYS: ${RECURRING_TRANSFER_MAX_DAYS:-366}
      MOCK_WEALTH_ENABLED: ${MOCK_WEALTH_ENABLED:-true}
      MOCK_SUBSCRIPTION_BILLING_ENABLED: ${MOCK_SUBSCRIPTION_BILLING_ENABLED:-true}
      MOCK_SCHEDULED_TRANSFERS_ENABLED: ${MOCK_SCHEDULED_TRANSFERS_ENABLED:-false}
      SCHEDULED_TRANSFER_MIN_ADVANCE_SECONDS: ${SCHEDULED_TRANSFER_MIN_ADVANCE_SECONDS:-60}
      SCHEDULED_TRANSFER_MAX_DAYS: ${SCHEDULED_TRANSFER_MAX_DAYS:-30}
      SCHEDULED_TRANSFER_LATE_WINDOW_SECONDS: ${SCHEDULED_TRANSFER_LATE_WINDOW_SECONDS:-300}
      SCHEDULED_TRANSFER_LEASE_SECONDS: ${SCHEDULED_TRANSFER_LEASE_SECONDS:-60}
      MOCK_PARTICIPANT_LOGIN_ENABLED: ${MOCK_PARTICIPANT_LOGIN_ENABLED:-false}
      MOCK_PARTICIPANT_SIGNING_KEY: ${MOCK_PARTICIPANT_SIGNING_KEY:-}
      TRANSFER_APPROVAL_TTL_SECONDS: ${TRANSFER_APPROVAL_TTL_SECONDS:-600}
      TRANSFER_REAUTH_TTL_SECONDS: ${TRANSFER_REAUTH_TTL_SECONDS:-300}
      TRANSFER_REAUTH_MAX_ATTEMPTS: ${TRANSFER_REAUTH_MAX_ATTEMPTS:-3}
      MOCK_REAUTH_CODE: ${MOCK_REAUTH_CODE:-246810}
      REAUTH_PROVIDER: ${REAUTH_PROVIDER:-mock}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_ISSUER: ${MFA_ISSUER:-AI Banking Agent}
      SUBSCRIPTION_READ_CONSENT_SECONDS: ${SUBSCRIPTION_READ_CONSENT_SECONDS:-300}
      OPERATION_RECOVERY_ENABLED: ${OPERATION_RECOVERY_ENABLED:-true}
      OPERATION_RECOVERY_POLL_INTERVAL_SECONDS: ${OPERATION_RECOVERY_POLL_INTERVAL_SECONDS:-5}
      OPERATION_RECOVERY_LEASE_SECONDS: ${OPERATION_RECOVERY_LEASE_SECONDS:-60}
      OPERATION_RECOVERY_INITIAL_RETRY_SECONDS: ${OPERATION_RECOVERY_INITIAL_RETRY_SECONDS:-5}
      OPERATION_RECOVERY_MAX_RETRY_SECONDS: ${OPERATION_RECOVERY_MAX_RETRY_SECONDS:-300}
      OPERATION_RECOVERY_BACKOFF_MULTIPLIER: ${OPERATION_RECOVERY_BACKOFF_MULTIPLIER:-2}
      OPERATION_RECOVERY_BATCH_SIZE: ${OPERATION_RECOVERY_BATCH_SIZE:-10}
      OUTBOX_PUBLISHER_ENABLED: ${OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_PUBLISHER_POLL_INTERVAL_SECONDS: ${OUTBOX_PUBLISHER_POLL_INTERVAL_SECONDS:-0.5}
      OUTBOX_PUBLISHER_LEASE_SECONDS: ${OUTBOX_PUBLISHER_LEASE_SECONDS:-30}
      OUTBOX_PUBLISHER_INITIAL_RETRY_SECONDS: ${OUTBOX_PUBLISHER_INITIAL_RETRY_SECONDS:-1}
      OUTBOX_PUBLISHER_MAX_RETRY_SECONDS: ${OUTBOX_PUBLISHER_MAX_RETRY_SECONDS:-60}
      OUTBOX_PUBLISHER_BACKOFF_MULTIPLIER: ${OUTBOX_PUBLISHER_BACKOFF_MULTIPLIER:-2}
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-20}
      TASK_WORKER_ENABLED: ${TASK_WORKER_ENABLED:-true}
      TASK_WORKER_POLL_INTERVAL_SECONDS: ${TASK_WORKER_POLL_INTERVAL_SECONDS:-0.5}
      TASK_WORKER_LEASE_SECONDS: ${TASK_WORKER_LEASE_SECONDS:-60}
      TASK_WORKER_HEARTBEAT_SECONDS: ${TASK_WORKER_HEARTBEAT_SECONDS:-15}
      TASK_WORKER_INITIAL_RETRY_SECONDS: ${TASK_WORKER_INITIAL_RETRY_SECONDS:-2}
      TASK_WORKER_MAX_RETRY_SECONDS: ${TASK_WORKER_MAX_RETRY_SECONDS:-120}
      TASK_WORKER_BACKOFF_MULTIPLIER: ${TASK_WORKER_BACKOFF_MULTIPLIER:-2}
      TASK_WORKER_BATCH_SIZE: ${TASK_WORKER_BATCH_SIZE:-4}
      TASK_WORKER_MAX_CONCURRENCY: ${TASK_WORKER_MAX_CONCURRENCY:-4}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE}
        NEXT_PUBLIC_OIDC_AUTHORITY: ${NEXT_PUBLIC_OIDC_AUTHORITY:-}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_OIDC_SCOPE: ${NEXT_PUBLIC_OIDC_SCOPE:-openid profile}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
