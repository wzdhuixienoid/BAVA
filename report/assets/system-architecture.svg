<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1560" viewBox="0 0 1440 1560">
<title>AI Banking Agent v0.9.2 当前系统架构</title>
<desc>模块化单体、受限模型路径、确定性写入边界、持久化和三个专用后台loop。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1440" height="1560" fill="#f8fafc"/>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#64748b}.head{font-size:22px;font-weight:700}.line{font-size:17px}.label{font-size:16px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text class="title" x="50" y="52">AI Banking Agent · v0.9.2</text>
<text class="sub" x="50" y="84">当前实现 · 2026-10-05 · Web + FastAPI 模块化单体 + PostgreSQL</text>
<rect x="40" y="120" width="430" height="112" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
<text class="head" x="60" y="154">用户 / Next.js Web</text>
<text class="line" x="60" y="182">中文文本、候选选择、明确确认</text>
<text class="line" x="60" y="206">工作台 / Dashboard / Reports / 订阅</text>
<rect x="510" y="120" width="430" height="112" rx="14" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
<text class="head" x="530" y="154">FastAPI Domain API</text>
<text class="line" x="530" y="182">服务器 Principal / ownership / typed DTO</text>
<text class="line" x="530" y="206">HTTP、fetch SSE；OIDC-ready 或开发身份</text>
<rect x="980" y="120" width="420" height="112" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
<text class="head" x="1000" y="154">LLM Provider（受约束）</text>
<text class="line" x="1000" y="182">Router / 意图提取 / Planner / 查询解释</text>
<text class="line" x="1000" y="206">只读 Tool 选择与受校验报告说明</text>
<path class="edge" d="M470 176 H510"/>
<text class="label" x="476" y="162">HTTP</text>
<path class="edge" d="M940 176 H980" stroke-dasharray="7 5"/>
<rect x="40" y="280" width="1360" height="110" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text class="head" x="60" y="314">持久消息与 Task 执行</text>
<text class="line" x="60" y="342">Message + Task + Event + Outbox 原子提交 → PostgreSQL Task claim / lease / heartbeat / attempt fence</text>
<text class="line" x="60" y="366">TaskExecutionWorker → InProcessTaskRunner → RequestRouter（分类不授予权限）</text>
<path class="edge" d="M725 232 V280"/>
<rect x="40" y="450" width="420" height="124" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
<text class="head" x="60" y="484">简单只读 Agent</text>
<text class="line" x="60" y="512">Minimal / Financial / Subscription</text>
<text class="line" x="60" y="536">共用 LangGraph：LLM ↔ Tool</text>
<text class="line" x="60" y="560">最多 6 LLM steps / 4 Tool calls</text>
<rect x="510" y="450" width="420" height="124" rx="14" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
<text class="head" x="530" y="484">受约束 Plan DAG</text>
<text class="line" x="530" y="512">Planner → Validator → Persistent DAG</text>
<text class="line" x="530" y="536">最多 8 步 / 2 条件 / 1 写 Workflow</text>
<text class="line" x="530" y="560">复用同一 Task Worker / 原有能力</text>
<rect x="980" y="450" width="420" height="124" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text class="head" x="1000" y="484">确定性 Workflow</text>
<text class="line" x="1000" y="512">Transfer / SubscriptionCancel</text>
<text class="line" x="1000" y="536">简单写请求走原路径</text>
<text class="line" x="1000" y="560">LLM 意图提取后退出资金执行路径</text>
<path class="edge" d="M250 390 V450"/>
<path class="edge" d="M720 390 V450"/>
<path class="edge" d="M1190 390 V450"/>
<rect x="40" y="635" width="420" height="136" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/>
<text class="head" x="60" y="669">只读 Tool / Domain 服务</text>
<text class="line" x="60" y="697">Registry → Policy → Executor</text>
<text class="line" x="60" y="721">Decimal Analytics / Subscription / Anomaly</text>
<text class="line" x="60" y="745">typed bounded facts；用户范围内读取</text>
<text class="line" x="60" y="769">FinancialSnapshot → Report Skill</text>
<rect x="510" y="635" width="420" height="136" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/>
<text class="head" x="530" y="669">确定性 CONDITION</text>
<text class="line" x="530" y="697">已完成 source → typed facts + Decimal</text>
<text class="line" x="530" y="721">原文 threshold / Decision + source hash</text>
<text class="line" x="530" y="745">FALSE → SKIPPED，零业务写资源</text>
<text class="line" x="530" y="769">TRUE → 原 Workflow，仍需用户控制</text>
<rect x="980" y="635" width="420" height="136" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text class="head" x="1000" y="669">写入前安全边界</text>
<text class="line" x="1000" y="697">RiskDecision / Approval hash + TTL</text>
<text class="line" x="1000" y="721">RED Mock Reauthentication / SecurityGuard</text>
<text class="line" x="1000" y="745">Guard 用户锁 → Transfer Risk 用户锁</text>
<text class="line" x="1000" y="769">commit-time exposure 与授权重校验</text>
<path class="edge" d="M250 574 V635"/>
<path class="edge" d="M720 574 V635"/>
<path class="edge" d="M1190 574 V635"/>
<path class="edge" d="M930 705 H980"/>
<text class="label" x="935" y="692">TRUE</text>
<path class="edge" d="M510 550 H460"/>
<text class="label" x="465" y="535">读能力</text>
<rect x="40" y="830" width="420" height="112" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/>
<text class="head" x="60" y="864">报告与只读 Projection</text>
<text class="line" x="60" y="892">Python report core + 受校验 LLM prose</text>
<text class="line" x="60" y="916">immutable Report / Dashboard / Audit</text>
<text class="line" x="60" y="940">后端决定事实，前端直接展示</text>
<rect x="510" y="830" width="420" height="112" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text class="head" x="530" y="864">OperationService</text>
<text class="line" x="530" y="892">Operation + Approval CONSUMED</text>
<text class="line" x="530" y="916">Workflow COMMITTING + Event/Outbox</text>
<text class="line" x="530" y="940">同事务提交，随后 Provider I/O</text>
<rect x="980" y="830" width="420" height="112" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
<text class="head" x="1000" y="864">Mock Banking Providers</text>
<text class="line" x="1000" y="892">Transfer / Subscription cancellation</text>
<text class="line" x="1000" y="916">固定 idempotency key + 持久 ledger</text>
<text class="line" x="1000" y="940">账户锁内重查余额与原子提交</text>
<path class="edge" d="M250 771 V830"/>
<path class="edge" d="M1190 771 V800 H720 V830"/>
<path class="edge" d="M930 886 H980"/>
<text class="label" x="934" y="871">写 Tool</text>
<rect x="40" y="1000" width="870" height="124" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text class="head" x="60" y="1034">Application PostgreSQL · Alembic head 0017</text>
<text class="line" x="60" y="1062">Conversation / Message / Task / Event / Outbox / Report</text>
<text class="line" x="60" y="1086">Workflow / Approval / Reauth / Operation / Guard / Identity / Plan DAG / Provider ledger</text>
<text class="line" x="60" y="1110">业务与调度事实源；业务成功须 Workflow + Operation 均为 SUCCEEDED</text>
<rect x="950" y="1000" width="450" height="145" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text class="head" x="970" y="1034">Runtime checkpoint / fixture</text>
<text class="line" x="970" y="1062">LangGraph PostgreSQL checkpoint tables</text>
<text class="line" x="970" y="1086">committed JSON：4账户 / 140交易</text>
<text class="line" x="970" y="1110">6收款人 / 5订阅合同 / Golden</text>
<text class="line" x="970" y="1134">checkpoint 不替代银行业务状态</text>
<path class="edge" d="M250 942 V1000"/>
<path class="edge" d="M720 942 V1000"/>
<path class="edge" d="M1190 942 V967 H880 V1000"/>
<rect x="40" y="1180" width="420" height="136" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="head" x="60" y="1214">TaskExecutionWorker</text>
<text class="line" x="60" y="1242">due / SKIP LOCKED / lease / heartbeat</text>
<text class="line" x="60" y="1266">attempt fencing / 退避 / 崩溃接管</text>
<text class="line" x="60" y="1290">Plan 不另建 Worker</text>
<text class="line" x="60" y="1314">API 进程托管专用 loop</text>
<rect x="510" y="1180" width="420" height="136" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="head" x="530" y="1214">OperationRecoveryWorker</text>
<text class="line" x="530" y="1242">只处理已有 CREATED/SUBMITTED/UNKNOWN</text>
<text class="line" x="530" y="1266">CREATED 用原 key；UNKNOWN 只查询</text>
<text class="line" x="530" y="1290">不新授权、不换 key 重提</text>
<text class="line" x="530" y="1314">复用 OperationService / Provider</text>
<rect x="980" y="1180" width="420" height="136" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="head" x="1000" y="1214">OutboxPublisher → SSE</text>
<text class="line" x="1000" y="1242">lease / 至少一次发布 / 同 event 可重发</text>
<text class="line" x="1000" y="1266">进程内 EventBus，无跨进程 broker</text>
<text class="line" x="1000" y="1290">SSE 提示浏览器重新 GET 资源</text>
<text class="line" x="1000" y="1314">不等于客户端已收到或业务成功</text>
<path class="edge" d="M250 1124 V1180"/>
<path class="edge" d="M720 1124 V1180"/>
<path class="edge" d="M900 1090 H930 V1150 H1190 V1180"/>
<text class="head" x="50" y="1380">图示边界</text>
<text class="line" x="50" y="1415">紫：受约束模型路径　绿：确定性查询/条件/事实　黄：确认与写业务　蓝：持久化　灰：专用后台 loop</text>
<text class="line" x="50" y="1448">当前：合成银行数据、Mock Provider / Mock 强验证、单 API Demo；OIDC 认证边界已实现但未接生产 IdP。</text>
<text class="line" x="50" y="1481">尚无：理财 / 卡片管理 / 定时支付 / AA / 生日下单 / 真实银行与 MFA / 任意模型代码执行沙箱。</text>
<text class="sub" x="50" y="1520">注：新发现原文条件和币种校验缺口、非 ASCII 验证码异常，见 report/01-requirements-and-bugs.md。</text>
</svg>
